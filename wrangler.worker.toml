name = "libretv"
main = "_worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
EXPECTED_HOSTNAME = "tv.444110.xyz"
TURNSTILE_SITE_KEY = "0x4AAAAAAA_eDna9q6FWwy6r"
CANONICAL_HOST = "tv.444110.xyz"
SEARCH_RATE_LIMIT = "5"
SEARCH_RATE_WINDOW_SECONDS = "60"
ACCESS_RATE_LIMIT = "5"
ACCESS_RATE_WINDOW_SECONDS = "60"

[[routes]]
pattern = "tv.444110.xyz/*"
zone_name = "444110.xyz"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
